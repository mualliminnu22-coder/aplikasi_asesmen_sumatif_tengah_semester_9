                // In a real app, we'd fetch from Firestore here.
                // For this interactive document, we'll rely on local state initially, 
                // but structure it so Firestore can easily replace it.
                const storedSettings = localStorage.getItem('mathExamSettings');
                if(storedSettings) {
                    setAppSettings(JSON.parse(storedSettings));
                }
                const storedQuestions = localStorage.getItem('mathExamQuestions');
                if(storedQuestions) {
                    setQuestions(JSON.parse(storedQuestions));
                }
                setDbInitialized(true);
            }, []);

            const handleLogin = (userData) => {
                setUser(userData);
                if (userData.role === 'admin') {
                    setView('admin_dashboard');
                } else {
                    setView('student_dashboard');
                }
            };

            const handleLogout = () => {
                setUser(null);
                setView('login');
                setExamData(null);
            };

            return (

                        {mode === 'student' ? (

                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">No. Presensi (Password)</label>

                                    </div>

        function StudentDashboard({ user, setView, setExamData }) {
            const startExam = () => {

            return (

                    <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded-r">

        function useTimer(initialSeconds, onComplete) {
            const [secondsLeft, setSecondsLeft] = useState(initialSeconds);

            useEffect(() => {
                if (secondsLeft <= 0) {
                    onComplete();
                    return;
                }
                const interval = setInterval(() => {
                    setSecondsLeft(prev => prev - 1);
                }, 1000);
                return () => clearInterval(interval);
            }, [secondsLeft, onComplete]);

            const formatTime = () => {
                const h = Math.floor(secondsLeft / 3600);
                const m = Math.floor((secondsLeft % 3600) / 60);
                const s = secondsLeft % 60;
                return `${h > 0 ? h + ':' : ''}${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            return { secondsLeft, formatTime };
        }

        function ExamInterface({ user, questions, setView, setExamData, examData, isPreview = false }) {
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [localAnswers, setLocalAnswers] = useState(examData?.answers || {});
            const [showConfirmSubmit, setShowConfirmSubmit] = useState(false);

            const handleTimeUp = useCallback(() => {
                if(!examData.isFinished) {
                   submitExam(true);
                }
            }, [localAnswers]); // Include localAnswers to submit current state

            const { secondsLeft, formatTime } = useTimer(examData?.timeLimit || 5400, handleTimeUp);

            const handleAnswerChange = (qId, value, type) => {
                const newAnswers = { ...localAnswers };
                
                if (type === 'pg') {
                    newAnswers[qId] = value;
                } else if (type === 'pg_kompleks') {
                    const currentArr = newAnswers[qId] || [];
                    if (currentArr.includes(value)) {
                        newAnswers[qId] = currentArr.filter(v => v !== value);
                    } else {
                        newAnswers[qId] = [...currentArr, value];
                    }
                } else if (type === 'menjodohkan') {
                    // value is { left: string, right: string }
                    const currentMatches = newAnswers[qId] || [];
                    // Remove existing match for the left side if it exists
                    const filteredMatches = currentMatches.filter(m => m.left !== value.left);
                    newAnswers[qId] = [...filteredMatches, value];
                }
                
                setLocalAnswers(newAnswers);
                setExamData({ ...examData, answers: newAnswers });
            };

            const submitExam = (autoSubmit = false) => {
                let score = 0;
                let correctCount = 0;
                const maxScore = 100;
                const totalQuestions = questions.length;
                const weightPerQuestion = maxScore / totalQuestions; // 100/30 = 3.33..

                questions.forEach(q => {
                    const ans = localAnswers[q.id];
                    if (!ans) return;

                    if (q.type === 'pg' && ans === q.answer) {
                        correctCount++;
                        score += weightPerQuestion;
                    } else if (q.type === 'pg_kompleks') {
                        // All must be correct to get full points for this question, or partial? 
                        // Let's implement strict: must select exact correct options.
                        const correctAnswers = q.answers;
                        if (ans.length === correctAnswers.length && ans.every(a => correctAnswers.includes(a))) {
                            correctCount++;
                            score += weightPerQuestion;
                        } else if (ans.length > 0) {
                            // Partial scoring for complex PG
                            const correctMatches = ans.filter(a => correctAnswers.includes(a)).length;
                            const incorrectMatches = ans.length - correctMatches;
                            // Only give partial score if they didn't just guess everything
                            if(incorrectMatches === 0) {
                                score += (weightPerQuestion * (correctMatches / correctAnswers.length));
                            }
                        }
                    } else if (q.type === 'menjodohkan') {
                        // ans is array of {left, right}
                        let matchCorrect = 0;
                        const totalPairs = q.pairs.length;
                        ans.forEach(match => {
                            const correctPair = q.pairs.find(p => p.left === match.left);
                            if (correctPair && correctPair.right === match.right) {
                                matchCorrect++;
                            }
                        });
                        score += (weightPerQuestion * (matchCorrect / totalPairs));
                        if(matchCorrect === totalPairs) correctCount++;
                    }
                });

                const finalScore = Math.round(score);

                if (!isPreview) {
                    // Save attempt data
                    const usersData = JSON.parse(localStorage.getItem('mathExamUsers') || '{}');
                    const userKey = `${user.kelas}_${user.presensi}`;
                    if (usersData[userKey]) {
                        usersData[userKey].attempts += 1;
                        usersData[userKey].scores.push({
                            score: finalScore,
                            date: new Date().toISOString(),
                            answers: localAnswers
                        });
                        localStorage.setItem('mathExamUsers', JSON.stringify(usersData));
                    }
                }

                setExamData({
                    ...examData,
                    answers: localAnswers,
                    score: finalScore,
                    isFinished: true,
                    timeSpent: (90 * 60) - secondsLeft
                });
                setView('result');
            };

            const q = questions[currentQIndex];

            // Setup Navigation array for sidebar
            const navButtons = questions.map((q, idx) => {
                let status = 'unanswered';
                const ans = localAnswers[q.id];
                if (ans) {
                    if (q.type === 'pg') status = 'answered';
                    else if (q.type === 'pg_kompleks' && ans.length > 0) status = 'answered';
                    else if (q.type === 'menjodohkan' && ans.length === q.pairs.length) status = 'answered'; // Complete
                    else if (q.type === 'menjodohkan' && ans.length > 0) status = 'partial';
                }
                return (
                    <button key={q.id} onClick={() => setCurrentQIndex(idx)}
                        className={`w-10 h-10 rounded text-sm font-medium border flex items-center justify-center transition
                            ${currentQIndex === idx ? 'ring-2 ring-emerald-500 ring-offset-1' : ''}
                            ${status === 'answered' ? 'bg-emerald-500 text-white border-emerald-600' : 
                              status === 'partial' ? 'bg-amber-400 text-slate-800 border-amber-500' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'}`}
                    >
                        {idx + 1}
                    </button>
                );
            });

            return (
                <div className="flex flex-col md:flex-row gap-6">
                    {/* Main Content Area */}
                    <div className="flex-1">
                        <div className="bg-white rounded-xl shadow mb-4 p-4 flex justify-between items-center sticky top-0 z-20">
                            <div>
                                <span className="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                                    Soal {currentQIndex + 1} dari {questions.length}
                                </span>
                                {isPreview && <span className="ml-2 bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-xs font-bold">MODE UJICOBA ADMIN</span>}
                            </div>
                            <div className={`font-mono text-lg font-bold flex items-center gap-2 px-4 py-1.5 rounded-lg ${secondsLeft < 300 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-slate-100 text-slate-800'}`}>
                                <i className="far fa-clock"></i> {formatTime()}
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow p-6 min-h-[400px]">
                            {/* Question Header */}
                            <div className="mb-6">
                                <h3 className="text-lg text-slate-800 font-medium leading-relaxed mb-2">{q.text}</h3>
                                {q.type === 'pg_kompleks' && <p className="text-sm text-blue-600 bg-blue-50 p-2 rounded inline-block"><i className="fas fa-info-circle mr-1"></i> Pilih semua jawaban yang benar (bisa lebih dari satu).</p>}
                                {q.type === 'menjodohkan' && <p className="text-sm text-amber-600 bg-amber-50 p-2 rounded inline-block"><i className="fas fa-info-circle mr-1"></i> Pasangkan item di sebelah kiri dengan yang tepat di sebelah kanan dengan mengkliknya.</p>}
                            </div>

                            {/* Options Area */}
                            <div className="space-y-3">
                                {q.type === 'pg' && q.options.map((opt, i) => (
                                    <label key={i} className={`flex items-start p-4 border rounded-lg cursor-pointer transition ${localAnswers[q.id] === opt ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                        <input type="radio" name={`q_${q.id}`} value={opt} checked={localAnswers[q.id] === opt} onChange={() => handleAnswerChange(q.id, opt, 'pg')} className="mt-1 w-5 h-5 text-emerald-600 focus:ring-emerald-500 border-gray-300" />
                                        <span className="ml-3 text-slate-700">{opt}</span>
                                    </label>
                                ))}

                                {q.type === 'pg_kompleks' && q.options.map((opt, i) => (
                                    <label key={i} className={`flex items-start p-4 border rounded-lg cursor-pointer transition ${(localAnswers[q.id] || []).includes(opt) ? 'border-blue-500 bg-blue-50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                        <input type="checkbox" checked={(localAnswers[q.id] || []).includes(opt)} onChange={() => handleAnswerChange(q.id, opt, 'pg_kompleks')} className="mt-1 w-5 h-5 text-blue-600 focus:ring-blue-500 rounded border-gray-300" />
                                        <span className="ml-3 text-slate-700">{opt}</span>
                                    </label>
                                ))}

                                {q.type === 'menjodohkan' && (
                                    <MatchingQuestion 
                                        question={q} 
                                        currentAnswers={localAnswers[q.id] || []} 
                                        onMatch={(left, right) => handleAnswerChange(q.id, {left, right}, 'menjodohkan')} 
                                    />
                                )}
                            </div>
                        </div>

                        {/* Navigation Buttons */}
                        <div className="flex justify-between items-center mt-6">
                            <button onClick={() => setCurrentQIndex(Math.max(0, currentQIndex - 1))} disabled={currentQIndex === 0} className="px-5 py-2 bg-slate-200 text-slate-700 rounded-lg disabled:opacity-50 hover:bg-slate-300 transition">
                                <i className="fas fa-chevron-left mr-2"></i> Sebelumnya
                            </button>
                            
                            {currentQIndex < questions.length - 1 ? (
                                <button onClick={() => setCurrentQIndex(currentQIndex + 1)} className="px-5 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-900 transition">
                                    Selanjutnya <i className="fas fa-chevron-right ml-2"></i>
                                </button>
                            ) : (
                                <button onClick={() => setShowConfirmSubmit(true)} className="px-6 py-2 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700 transition shadow-md">
                                    Selesai & Kumpulkan
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Sidebar / Grid */}
                    <div className="w-full md:w-72 flex-shrink-0">
                        <div className="bg-white rounded-xl shadow p-4 sticky top-4">
                            <h4 className="font-semibold text-slate-800 mb-3 border-b pb-2">Navigasi Soal</h4>
                            <div className="grid grid-cols-5 gap-2 max-h-[60vh] overflow-y-auto pr-1">
                                {navButtons}
                            </div>
                            
                            <div className="mt-6 pt-4 border-t space-y-2 text-sm text-slate-600">
                                <div className="flex items-center gap-2"><div className="w-4 h-4 bg-emerald-500 rounded border border-emerald-600"></div> Sudah dijawab</div>
                                <div className="flex items-center gap-2"><div className="w-4 h-4 bg-amber-400 rounded border border-amber-500"></div> Dijawab Sebagian</div>
                                <div className="flex items-center gap-2"><div className="w-4 h-4 bg-white rounded border border-slate-300"></div> Belum dijawab</div>
                            </div>

                            <button onClick={() => setShowConfirmSubmit(true)} className="w-full mt-6 px-4 py-2 bg-emerald-100 text-emerald-800 border border-emerald-300 font-semibold rounded hover:bg-emerald-200 transition">
                                Akhiri Ujian
                            </button>
                        </div>
                    </div>

                    {/* Confirmation Modal */}
                    {showConfirmSubmit && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full">
                                <h3 className="text-xl font-bold mb-4 text-slate-800">Konfirmasi Pengumpulan</h3>
                                <p className="mb-6 text-slate-600">Apakah Anda yakin ingin mengakhiri ujian dan mengumpulkan jawaban? Waktu masih tersisa <strong>{formatTime()}</strong>.</p>
                                <div className="flex gap-3 justify-end">
                                    <button onClick={() => setShowConfirmSubmit(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded transition">Batal</button>
                                    <button onClick={() => submitExam(false)} className="px-6 py-2 bg-emerald-600 text-white font-bold rounded hover:bg-emerald-700 transition">Ya, Kumpulkan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function MatchingQuestion({ question, currentAnswers, onMatch }) {
            const [selectedLeft, setSelectedLeft] = useState(null);
            
            // Randomize right side only once per render
            const [rightOptions, setRightOptions] = useState([]);
            
            useEffect(() => {
                // Shuffle right side
                const rights = question.pairs.map(p => p.right);
                for (let i = rights.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [rights[i], rights[j]] = [rights[j], rights[i]];
                }
                setRightOptions(rights);
            }, [question]);

            const handleLeftClick = (text) => {
                if (selectedLeft === text) setSelectedLeft(null); // Deselect
                else setSelectedLeft(text);
            };

            const handleRightClick = (rightText) => {
                if (!selectedLeft) return; // Must select left first
                onMatch(selectedLeft, rightText);
                setSelectedLeft(null);
            };

            const handleRemoveMatch = (leftText, e) => {
                e.stopPropagation();
                // Send dummy match to remove it visually if needed, but easier is to let upper state handle it by sending null right side if we wanted to clear.
                // For simplicity, re-clicking left and a new right overwrites. 
                // To just clear, let's pass a special value or just let them overwrite.
            };

            return (
                <div className="grid grid-cols-2 gap-8 relative select-none">
                    {/* Left Side (Premis) */}
                    <div className="space-y-4">
                        <h4 className="font-semibold text-slate-600 text-center mb-2">Pernyataan</h4>
                        {question.pairs.map((pair, idx) => {
                            const isSelected = selectedLeft === pair.left;
                            const currentMatch = currentAnswers.find(a => a.left === pair.left);
                            const hasMatch = !!currentMatch;
                            
                            return (
                                <div key={`l-${idx}`} 
                                    onClick={() => handleLeftClick(pair.left)}
                                    className={`match-item p-3 rounded border-2 flex justify-between items-center bg-white z-10 relative
                                        ${isSelected ? 'selected border-emerald-500 shadow-md ring-2 ring-emerald-200 ring-offset-1' : 'border-slate-300 hover:border-slate-400'}
                                        ${hasMatch && !isSelected ? 'border-blue-400 bg-blue-50' : ''}`
                                    }>
                                    <span className="text-sm">{pair.left}</span>
                                    {hasMatch && <span className="text-xs bg-blue-500 text-white px-2 py-1 rounded-full"><i className="fas fa-link"></i> Terhubung</span>}
                                </div>
                            );
                        })}
                    </div>

                    {/* Right Side (Respon) */}
                    <div className="space-y-4">
                         <h4 className="font-semibold text-slate-600 text-center mb-2">Pilihan Jawaban</h4>
                        {rightOptions.map((text, idx) => {
                            const matchedBy = currentAnswers.find(a => a.right === text);
                            const isMatched = !!matchedBy;
                            const isTarget = selectedLeft !== null && !isMatched;

                            return (
                                <div key={`r-${idx}`}
                                    onClick={() => isTarget ? handleRightClick(text) : null}
                                    className={`match-item p-3 rounded border-2 bg-white z-10 relative text-sm text-center flex flex-col justify-center
                                        ${isMatched ? 'border-blue-400 bg-slate-100 text-slate-500 cursor-not-allowed' : 'border-slate-300'}
                                        ${isTarget ? 'hover:border-emerald-500 hover:bg-emerald-50 cursor-crosshair border-dashed' : ''}
                                    `}>
                                    {text}
                                    {isMatched && <div className="text-[10px] text-blue-600 mt-1 truncate">Pasangan: {matchedBy.left}</div>}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function ResultView({ examData, user, setView }) {
            const kkm = 80;
            const score = examData.score || 0;
            const isPass = score >= kkm;

            const timeMin = Math.floor(examData.timeSpent / 60);
            const timeSec = examData.timeSpent % 60;

            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="max-w-3xl mx-auto mt-6">
                    <div className="bg-white rounded-xl shadow-lg overflow-hidden border-t-8 border-emerald-600 print-only:border-0 print-only:shadow-none">
                        
                        <div className="p-8 text-center border-b">
                            {/* Certificate like Header */}
                            <h2 className="text-2xl font-bold text-slate-800 mb-1 uppercase tracking-wider">Hasil Asesmen Sumatif</h2>
                            <p className="text-slate-500">Tengah Semester - Matematika Kelas IX</p>
                            <p className="text-sm font-semibold text-slate-600 mt-1">MTs. Mu'allimin NU Kota Malang</p>
                        </div>

                        <div className="p-8">
                            <div className="flex flex-col md:flex-row gap-8 items-center justify-between mb-8">
                                <div className="flex-1 space-y-3">
                                    <div className="grid grid-cols-3 border-b border-slate-100 pb-2">
                                        <span className="text-slate-500 font-medium col-span-1">Nama Siswa</span>
                                        <span className="text-slate-800 font-bold col-span-2">: {user.name}</span>
                                    </div>
                                    <div className="grid grid-cols-3 border-b border-slate-100 pb-2">
                                        <span className="text-slate-500 font-medium col-span-1">Kelas / No.</span>
                                        <span className="text-slate-800 font-bold col-span-2">: {user.kelas} / {user.presensi}</span>
                                    </div>
                                    <div className="grid grid-cols-3 border-b border-slate-100 pb-2">
                                        <span className="text-slate-500 font-medium col-span-1">Waktu Pengerjaan</span>
                                        <span className="text-slate-800 font-bold col-span-2">: {timeMin} menit {timeSec} detik</span>
                                    </div>
                                </div>
                                
                                <div className="w-40 h-40 rounded-full border-8 flex flex-col items-center justify-center bg-slate-50 
                                    ${isPass ? 'border-emerald-500' : 'border-red-400'}">
                                    <span className="text-slate-500 text-xs font-bold uppercase tracking-widest mb-1">Nilai</span>
                                    <span className={`text-5xl font-black ${isPass ? 'text-emerald-600' : 'text-red-500'}`}>
                                        {score}
                                    </span>
                                </div>
                            </div>

                            <div className={`p-4 rounded-lg text-center font-bold text-lg mb-6 ${isPass ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                                {isPass ? (
                                    <><i className="fas fa-check-circle mr-2"></i> Selamat! Anda mencapai nilai KKM (80).</>
                                ) : (
                                    <><i className="fas fa-times-circle mr-2"></i> Belum mencapai KKM (80). Tetap semangat belajar!</>
                                )}
                            </div>

                            <div className="bg-slate-50 p-4 rounded-lg text-sm text-slate-600 border print-only:border-0 print-only:p-0 print-only:bg-transparent">
                                <p><strong>Catatan:</strong> Dokumen ini merupakan bukti sah penyelesaian asesmen. Silakan unduh atau cetak halaman ini sebagai arsip pribadi.</p>
                                <p className="mt-2 text-xs italic print-only:block hidden">Dicetak pada: {new Date().toLocaleString('id-ID')}</p>
                            </div>
                        </div>

                        <div className="bg-slate-100 p-4 flex gap-4 justify-center no-print">
                            <button onClick={handlePrint} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-medium transition shadow flex items-center gap-2">
                                <i className="fas fa-print"></i> Cetak / Download PDF
                            </button>
                            <button onClick={() => setView('student_dashboard')} className="bg-slate-600 hover:bg-slate-700 text-white px-6 py-2 rounded font-medium transition shadow">
                                Kembali ke Beranda
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminDashboard({ setView, user, setExamData, questions, appSettings, setAppSettings }) {
            const [usersData, setUsersData] = useState({});

            useEffect(() => {
                const storedUsers = JSON.parse(localStorage.getItem('mathExamUsers') || '{}');
                setUsersData(storedUsers);
            }, []);

            const testAsStudent = () => {
                setExamData({
                    answers: {},
                    startTime: Date.now(),
                    timeLimit: 90 * 60,
                    isFinished: false
                });
                setView('exam');
            };

            const updateSettings = (e) => {
                e.preventDefault();
                localStorage.setItem('mathExamSettings', JSON.stringify(appSettings));
                alert('Pengaturan berhasil disimpan!');
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-xl shadow p-6">
                        <h2 className="text-2xl font-bold text-slate-800 mb-2">Panel Administrator</h2>
                        <p className="text-slate-600 mb-6">Kelola soal, pantau hasil ujian siswa, dan atur pengaturan aplikasi.</p>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-5 flex flex-col justify-between">
                                <div>
                                    <h3 className="font-bold text-emerald-800 text-lg mb-1"><i className="fas fa-book mr-2"></i>Kelola Soal</h3>
                                    <p className="text-sm text-emerald-600 mb-4">Total: {questions.length} Soal (10 PG, 15 PGK, 5 Menjodohkan)</p>
                                </div>
                                <button onClick={() => setView('admin_edit')} className="bg-emerald-600 text-white w-full py-2 rounded hover:bg-emerald-700 transition font-medium">Edit Bank Soal</button>
                            </div>
                            
                            <div className="bg-purple-50 border border-purple-200 rounded-lg p-5 flex flex-col justify-between">
                                <div>
                                    <h3 className="font-bold text-purple-800 text-lg mb-1"><i className="fas fa-play-circle mr-2"></i>Simulasi Ujian</h3>
                                    <p className="text-sm text-purple-600 mb-4">Uji coba aplikasi sebagai siswa tanpa mengurangi kuota.</p>
                                </div>
                                <button onClick={testAsStudent} className="bg-purple-600 text-white w-full py-2 rounded hover:bg-purple-700 transition font-medium">Mulai Uji Coba</button>
                            </div>

                            <div className="bg-blue-50 border border-blue-200 rounded-lg p-5 flex flex-col justify-between">
                                <div>
                                    <h3 className="font-bold text-blue-800 text-lg mb-1"><i className="fas fa-users mr-2"></i>Data Siswa</h3>
                                    <p className="text-sm text-blue-600 mb-4">{Object.keys(usersData).length} siswa terdaftar di database lokal.</p>
                                </div>
                                <button onClick={() => alert('Fitur rekap lengkap dapat dikembangkan lebih lanjut. Saat ini data tersimpan di LocalStorage browser.')} className="bg-blue-600 text-white w-full py-2 rounded hover:bg-blue-700 transition font-medium">Lihat Rekap Nilai</button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow p-6">
                        <h3 className="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Pengaturan Aplikasi</h3>
                        <form onSubmit={updateSettings} className="max-w-md space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Ganti Password Admin</label>
                                <input type="text" className="w-full p-2 border rounded focus:ring-2 focus:ring-emerald-500" 
                                    value={appSettings.adminPassword} 
                                    onChange={(e) => setAppSettings({...appSettings, adminPassword: e.target.value})} />
                                <p className="text-xs text-slate-500 mt-1">Default: admin123</p>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">URL Logo Sekolah (Opsional)</label>
                                <input type="url" className="w-full p-2 border rounded focus:ring-2 focus:ring-emerald-500" 
                                    placeholder="https://example.com/logo.png"
                                    value={appSettings.logo} 
                                    onChange={(e) => setAppSettings({...appSettings, logo: e.target.value})} />
                            </div>
                            <button type="submit" className="bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-900 transition font-medium">Simpan Pengaturan</button>
                        </form>
                    </div>

                    {/* Quick View Results */}
                    <div className="bg-white rounded-xl shadow p-6">
                        <h3 className="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Log Pengerjaan Siswa Terakhir</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 text-slate-600 border-b">
                                    <tr>
                                        <th className="p-3">Nama</th>
                                        <th className="p-3">Kelas / Presensi</th>
                                        <th className="p-3 text-center">Percobaan Ke</th>
                                        <th className="p-3 text-center">Nilai Tertinggi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {Object.values(usersData).length === 0 ? (
                                        <tr><td colSpan="4" className="p-4 text-center text-slate-500 italic">Belum ada data siswa yang mengerjakan.</td></tr>
                                    ) : (
                                        Object.values(usersData).map((u, i) => (
                                            <tr key={i} className="border-b hover:bg-slate-50">
                                                <td className="p-3 font-medium">{u.name}</td>
                                                <td className="p-3">{u.kelas} / {u.presensi}</td>
                                                <td className="p-3 text-center">{u.attempts}</td>
                                                <td className="p-3 text-center font-bold text-emerald-600">
                                                    {u.scores && u.scores.length > 0 ? Math.max(...u.scores.map(s => s.score)) : '-'}
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminEditQuestions({ questions, setQuestions, setView }) {
            // Simplified editor for demo purposes. Full implementation would need complex form arrays.
            
            const handleSaveAll = () => {
                localStorage.setItem('mathExamQuestions', JSON.stringify(questions));
                alert('Bank Soal berhasil disimpan secara lokal!');
            };

            const handleResetDefault = () => {
                if(confirm("Apakah Anda yakin ingin mengembalikan soal ke bawaan awal?")) {
                    setQuestions(INITIAL_QUESTIONS);
                    localStorage.removeItem('mathExamQuestions');
                }
            };

            return (
                <div className="bg-white rounded-xl shadow p-6">
                    <div className="flex justify-between items-center mb-6 border-b pb-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Edit Bank Soal</h2>
                            <p className="text-slate-600 text-sm">Menampilkan raw data view untuk efisiensi di mode demo.</p>
                        </div>
                        <div className="flex gap-2">
                             <button onClick={handleResetDefault} className="px-4 py-2 border border-red-200 text-red-600 rounded hover:bg-red-50 text-sm font-medium transition">Reset Default</button>
                            <button onClick={() => setView('admin_dashboard')} className="px-4 py-2 bg-slate-200 text-slate-700 rounded hover:bg-slate-300 text-sm font-medium transition">Kembali</button>
                            <button onClick={handleSaveAll} className="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700 text-sm font-medium transition shadow">Simpan Perubahan</button>
                        </div>
                    </div>

                    <div className="bg-slate-800 rounded-lg p-4 font-mono text-sm text-green-400 overflow-auto h-[600px] w-full">
                        <textarea 
                            className="w-full h-full bg-transparent border-none outline-none resize-none"
                            value={JSON.stringify(questions, null, 2)}
                            onChange={(e) => {
                                try {
                                    setQuestions(JSON.parse(e.target.value));
                                } catch (err) {
                                    // ignore invalid json during typing
                                }
                            }}
                            spellCheck="false"
                        />
                    </div>
                    <p className="text-xs text-slate-500 mt-2"><i className="fas fa-info-circle"></i> Di versi production, ini akan menjadi form visual yang user-friendly per tipe soal.</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
